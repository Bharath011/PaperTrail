name: Deploy PaperTrail shared database API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papertrail-api
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.ENABLE_CLOUDFLARE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run db:remote
      - run: npm run build
      - run: node scripts/prepare-cloudflare-deploy.mjs
      - run: npx wrangler deploy --config dist/server/wrangler.json
